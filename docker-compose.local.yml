# Local AXIOM stack. From the repository root:
#   Copy-Item deploy/local/.env.example deploy/local/.env
#   # replace CHANGE_ME
#   docker compose --env-file deploy/local/.env -f docker-compose.local.yml up -d --build
#
# This starts the Vue frontend, MySQL, PostgreSQL, Qdrant, Agent API, Worker and auth.

name: axiom

x-agent-environment: &agent-environment
  PROJECT_NAME: AXIOM Agent API
  DATABASE_URL: mysql+aiomysql://axiom:${AXIOM_DB_PASSWORD}@mysql:3306/ai_boot?charset=utf8mb4
  CHECKPOINT_DATABASE_URL: postgresql://axiom:${AXIOM_DB_PASSWORD}@postgres:5432/langgraph_checkpoints
  RUNTIME_DATABASE_URL: postgresql+psycopg://axiom:${AXIOM_DB_PASSWORD}@postgres:5432/agent_runtime
  QDRANT_URL: http://qdrant:6333
  JAVA_INTERNAL_BASE: http://auth-api:9090
  NEWAPI_BASE_URL: ${AXIOM_MODEL_BASE_URL:-http://host.docker.internal:3001/v1}
  # 空表时用于初始化 ai_chat_model（模型目录）。校园百事通等处的模型下拉读的是这张表，
  # 不设则目录为空、管理员无法为智能体选择模型。逗号分隔，第一个为默认。
  INITIAL_CHAT_MODELS: ${AXIOM_INITIAL_CHAT_MODELS:-}
  AUTH_TOKEN_CACHE_TTL_SECONDS: "0"
  RUNTIME_REQUIRED: "true"
  MIGRATE_ON_STARTUP: "true"
  FILE_STORAGE_PROVIDER: local
  CONNECTOR_SECRET_KEY: ${AXIOM_CONNECTOR_SECRET}
  GATEWAY_IDENTITY_SIGNATURE_REQUIRED: "false"

x-agent-healthcheck: &agent-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
  interval: 15s
  timeout: 10s
  retries: 12
  start_period: 180s

services:
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
      args:
        VITE_LOGIN_AES_KEY: ${AXIOM_LOGIN_AES_KEY:-AxiomCampusKey16}
        VITE_LOGIN_AES_IV: ${AXIOM_LOGIN_AES_IV:-AxiomCampusIv16!}
        VITE_REQUEST_SIGNATURE_SALT: ${AXIOM_REQUEST_SIGNATURE_SALT:-AxiomSignSalt}
        VITE_LOCAL_DEMO_USERNAME: ${AXIOM_LOCAL_DEMO_USERNAME:-}
        VITE_LOCAL_DEMO_PASSWORD: ${AXIOM_LOCAL_DEMO_PASSWORD:-}
    container_name: axiom-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:80"
    depends_on:
      auth-api:
        condition: service_healthy
      agent-api:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: axiom-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${AXIOM_DB_PASSWORD:?Set AXIOM_DB_PASSWORD in deploy/local/.env}
      MYSQL_DATABASE: ai_boot
      MYSQL_USER: axiom
      MYSQL_PASSWORD: ${AXIOM_DB_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - axiom_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${AXIOM_DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: axiom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: axiom
      POSTGRES_PASSWORD: ${AXIOM_DB_PASSWORD:?Set AXIOM_DB_PASSWORD in deploy/local/.env}
      POSTGRES_DB: langgraph_checkpoints
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - axiom_pg_data:/var/lib/postgresql/data
      - ./deploy/local/init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom -d langgraph_checkpoints"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.9.7
    container_name: axiom-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - axiom_qdrant_data:/qdrant/storage

  auth-api:
    build: ./auth-api
    container_name: axiom-auth-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      LOGIN_AES_KEY: ${AXIOM_LOGIN_AES_KEY:-AxiomCampusKey16}
      LOGIN_AES_IV: ${AXIOM_LOGIN_AES_IV:-AxiomCampusIv16!}
      AXIOM_ADMIN_USER: ${AXIOM_ADMIN_USER:-admin}
      AXIOM_ADMIN_PASSWORD: ${AXIOM_ADMIN_PASSWORD:?Set a unique AXIOM_ADMIN_PASSWORD in deploy/local/.env}
      AXIOM_LOCAL_DEMO_LOGIN: ${AXIOM_LOCAL_DEMO_LOGIN:-false}
      AXIOM_AUTH_DB: /app/data/auth.sqlite3
      AXIOM_CORS_ORIGINS: ${AXIOM_CORS_ORIGINS:-http://127.0.0.1:3200,http://localhost:3200}
    volumes:
      - axiom_auth_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  agent-api:
    build:
      context: ./agent-api
      dockerfile: Dockerfile.local
    container_name: axiom-agent-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment: *agent-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./agent-api/data/user_files:/app/data/user_files
    healthcheck: *agent-healthcheck
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      auth-api:
        condition: service_healthy

  agent-worker:
    build:
      context: ./agent-api
      dockerfile: Dockerfile.local
    container_name: axiom-agent-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *agent-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./agent-api/data/user_files:/app/data/user_files
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      auth-api:
        condition: service_healthy

volumes:
  axiom_mysql_data:
  axiom_pg_data:
  axiom_qdrant_data:
  axiom_auth_data:
