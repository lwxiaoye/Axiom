# 服务器上做开发时的叠加配置：前端不再以容器形式提供，而是在宿主机跑
# Vite dev server（端口 3200，见 .env / .env.development）。
#
#   docker compose --env-file deploy/local/.env \
#     -f docker-compose.local.yml -f docker-compose.server.yml -f docker-compose.dev.yml up -d
#   pnpm dev
#
# 回到容器化部署时去掉本文件即可。
services:
  # dev server 在宿主机，需要能直接访问 auth-api（VITE_PROXY 指向 127.0.0.1:9090）。
  # 源码挂进容器并开启 --reload：改 auth-api 的 Python 代码即时生效，不必重建镜像。
  auth-api:
    ports: !override
      - "127.0.0.1:9090:9090"
    volumes:
      # 挂整个目录而不是单个文件：git merge/checkout 会用新 inode 替换文件，单文件
      # bind mount 仍指向旧 inode，容器里永远是旧代码且 --reload 毫无察觉。
      # 与 docker-compose.local.yml 的 axiom_auth_data 卷（/app/data）嵌套共存。
      - ./auth-api:/app:ro
    command:
      ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "9090", "--no-proxy-headers", "--reload"]

  # agent-api 同理：源码挂进容器 + --reload（镜像里装了 watchfiles，走 inotify
  # 而非轮询，1 vCPU 上开销可忽略）。此前改一行后端代码要重建镜像，几分钟起步。
  agent-api:
    volumes:
      - ./agent-api/data/user_files:/app/data/user_files
      - ./agent-api/app:/app/app:ro
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]

  # worker 与 agent-api 共用同一镜像——只重建/重启 agent-api 是抓不到它的，
  # 这里一并挂源码，改完 docker compose restart agent-worker 即可生效。
  agent-worker:
    volumes:
      - ./agent-api/data/user_files:/app/data/user_files
      - ./agent-api/app:/app/app:ro

  # 前端改由 Vite dev server 提供，容器不参与 up
  frontend:
    profiles: ["packaged"]
