# Versioned migration targets. See README.md for Chinese runbook details.
#   mysql   = application MySQL database
#   runtime = PostgreSQL runtime database
# Select the target explicitly:
#   alembic -c migrations/alembic.ini -n mysql upgrade head
#   alembic -c migrations/alembic.ini -n runtime upgrade head
# The default [alembic] section is intentionally rejected by env.py.
# Keep this file ASCII-only: Alembic reads INI files with the Windows locale codec.

[alembic]
# Fallback section retained for Alembic CLI structure; env.py requires -n mysql or -n runtime.
script_location = %(here)s
prepend_sys_path = %(here)s/..
path_separator = os

[mysql]
script_location = %(here)s
version_locations = %(here)s/versions/mysql
prepend_sys_path = %(here)s/..
path_separator = os

[runtime]
script_location = %(here)s
version_locations = %(here)s/versions/runtime
prepend_sys_path = %(here)s/..
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
