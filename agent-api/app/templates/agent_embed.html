<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智能体</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #1f2937; }
    #agent { min-height: 160px; padding: 14px; display: grid; gap: 12px; }
    #messages { display: grid; gap: 8px; max-height: 360px; overflow: auto; }
    #interactions { display: grid; gap: 8px; }
    .message { max-width: 88%; padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; background: #f3f4f6; }
    .message.user { justify-self: end; background: #e0e7ff; }
    #composer { display: flex; gap: 8px; flex-wrap: wrap; }
    #input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font: inherit; }
    #files { max-width: 100%; }
    button { border: 0; border-radius: 8px; padding: 8px 12px; background: #4f46e5; color: #fff; font: inherit; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .65; }
    body[data-theme="dark"] { color-scheme: dark; background: #111827; color: #f9fafb; }
    body[data-theme="dark"] .message { background: #374151; }
    body[data-theme="dark"] .message.user { background: #3730a3; }
  </style>
</head>
<body data-parent-origin="__PARENT_ORIGIN__">
  <main id="agent" aria-live="polite">
    <section id="messages" aria-label="对话消息"></section>
    <section id="interactions" aria-label="需要补充的信息"></section>
    <form id="composer">
      <input id="input" autocomplete="off" aria-label="输入消息" placeholder="输入消息" required>
      <input id="files" type="file" multiple aria-label="上传附件">
      <button id="submit" type="submit">发送</button>
    </form>
  </main>
  <script>
    (() => {
      const parentOrigin = document.body.dataset.parentOrigin;
      const messages = document.getElementById('messages');
      const interactions = document.getElementById('interactions');
      const form = document.getElementById('composer');
      const input = document.getElementById('input');
      const submit = document.getElementById('submit');
      const files = document.getElementById('files');
      const embedKey = new URLSearchParams(window.location.hash.slice(1)).get('embedKey');
      const frameMarker = '/embed/v1/frame/';
      const markerIndex = window.location.pathname.indexOf(frameMarker);
      const apiPrefix = markerIndex >= 0 ? window.location.pathname.slice(0, markerIndex) : '';
      const apiBase = `${apiPrefix}/embed/v1`;
      const appId = markerIndex >= 0 ? window.location.pathname.slice(markerIndex + frameMarker.length) : '';
      let embedToken = '';
      let sessionId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now());
      let fileIds = [];

      const notify = (type, payload = {}) => window.parent.postMessage({ type, ...payload }, parentOrigin);
      const resize = () => notify('qz-agent.resize', { height: document.documentElement.scrollHeight });
      const addMessage = (text, kind) => {
        const item = document.createElement('div');
        item.className = `message ${kind}`;
        item.textContent = text;
        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
        resize();
      };
      const error = (message) => {
        addMessage(message, 'agent');
        notify('qz-agent.error', { message });
      };

      const requestInteraction = (runId, interaction) => new Promise((resolve, reject) => {
        interactions.replaceChildren();
        const params = interaction?.params || {};
        const wrapper = document.createElement('form');
        const description = document.createElement('div');
        description.textContent = params.description || '请补充信息后继续';
        wrapper.appendChild(description);
        const controls = [];
        if (interaction?.type === 'userSelect') {
          const select = document.createElement('select');
          for (const option of (params.userSelectOptions || [])) {
            const item = document.createElement('option');
            item.value = String(option.value ?? option.key ?? '');
            item.textContent = String(option.value ?? option.label ?? option.key ?? '');
            select.appendChild(item);
          }
          controls.push({ key: '', element: select });
          wrapper.appendChild(select);
        } else {
          for (const field of (params.inputForm || params.userInputForms || [])) {
            const label = document.createElement('label');
            label.textContent = String(field.label || field.key || '输入');
            const control = document.createElement('input');
            control.name = String(field.key || 'value');
            control.required = Boolean(field.required);
            control.value = String(field.defaultValue || '');
            label.appendChild(control);
            controls.push({ key: control.name, element: control });
            wrapper.appendChild(label);
          }
        }
        const button = document.createElement('button');
        button.type = 'submit';
        button.textContent = '继续';
        wrapper.appendChild(button);
        wrapper.addEventListener('submit', async (event) => {
          event.preventDefault();
          button.disabled = true;
          const value = interaction?.type === 'userSelect'
            ? controls[0]?.element.value
            : Object.fromEntries(controls.map(({ key, element }) => [key, element.value]));
          try {
            const response = await fetch(`${apiBase}/runs/${encodeURIComponent(runId)}/inputs?session_id=${encodeURIComponent(sessionId)}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: `Embed ${embedToken}` },
              body: JSON.stringify({ interactionId: interaction.id, value }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data?.error?.message || '提交信息失败。');
            interactions.replaceChildren();
            resize();
            resolve(data);
          } catch (reason) {
            button.disabled = false;
            reject(reason);
          }
        });
        interactions.appendChild(wrapper);
        resize();
      });

      window.addEventListener('message', (event) => {
        if (event.origin !== parentOrigin || event.source !== window.parent) return;
        if (!event.data || event.data.type !== 'qz-agent.set-theme') return;
        document.body.dataset.theme = event.data.theme === 'dark' ? 'dark' : 'light';
        resize();
      });

      const exchange = async () => {
        if (!embedKey) throw new Error('嵌入凭据无效，请重新打开页面。');
        const response = await fetch(`${apiBase}/agents/${encodeURIComponent(appId)}/direct-sessions`, {
          method: 'POST', headers: { Authorization: `Embed-Key ${embedKey}` },
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.token) throw new Error(data?.error?.message || '嵌入会话初始化失败。');
        embedToken = data.token;
        window.history.replaceState({}, document.title, window.location.pathname);
        notify('qz-agent.ready');
        resize();
      };

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text || !embedToken) return;
        input.value = '';
        addMessage(text, 'user');
        submit.disabled = true;
        try {
          const pendingFiles = Array.from(files.files || []);
          for (const file of pendingFiles) {
            const formData = new FormData();
            formData.append('file', file);
            const uploaded = await fetch(`${apiBase}/files?session_id=${encodeURIComponent(sessionId)}`, {
              method: 'POST', headers: { Authorization: `Embed ${embedToken}` }, body: formData,
            });
            const fileData = await uploaded.json().catch(() => ({}));
            if (!uploaded.ok || !fileData.id) throw new Error(fileData?.error?.message || '附件上传失败。');
            fileIds.push(fileData.id);
          }
          files.value = '';
          const response = await fetch(`${apiBase}/runs`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Embed ${embedToken}` },
            body: JSON.stringify({ input: text, sessionId, fileIds }),
          });
          let data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data?.error?.message || '智能体执行失败。');
          while (data.status === 'waiting_external_input' && data.interaction) {
            data = await requestInteraction(data.runId, data.interaction);
          }
          addMessage(data.output || '', 'agent');
          notify('qz-agent.completed', { runId: data.runId || '' });
        } catch (reason) {
          error(reason instanceof Error ? reason.message : '智能体执行失败。');
        } finally {
          submit.disabled = false;
          input.focus();
          resize();
        }
      });

      exchange().catch((reason) => error(reason instanceof Error ? reason.message : '嵌入会话初始化失败。'));
      new ResizeObserver(resize).observe(document.body);
    })();
  </script>
</body>
</html>
