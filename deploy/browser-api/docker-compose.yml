# agent-browser —— 独立浏览器服务，部署在服务器 8089。
#
# 两个服务，同一个镜像，按需起：
#   agent-browser      主用。@playwright/mcp（微软官方开源 MCP 服务器），端口 8089。
#                      自带 browser_navigate / browser_click / browser_type /
#                      browser_snapshot / browser_take_screenshot 等工具，开箱即用。
#   agent-browser-ws   可选（profile=ws）。playwright run-server，ws 端点 8090。
#                      给「沙箱里写脚本批量抓取」用：chromium.connect() 远程驱动。
#
# 启停：
#   docker compose up -d --build              # 只起 MCP（8089）
#   docker compose --profile ws up -d          # 额外起 ws 端点（8090）
#   docker compose logs -f agent-browser
#   docker compose down
#
# ⚠️ 8089 没有任何认证 —— 谁连上都能开一个浏览器。必须用防火墙把来源限制到 agent-api
#    所在的那台机器，见 README「暴露与认证」。这不是可选项。
services:
  agent-browser:
    build:
      context: .
      args:
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-1.61.0}
        MCP_VERSION: ${MCP_VERSION:-0.0.76}
        # 国内环境旁路（见 .env「国内环境」一节）
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-}
        BASE_IMAGE_REPO: ${BASE_IMAGE_REPO:-mcr.microsoft.com/playwright}
    image: agent-browser:${PLAYWRIGHT_VERSION:-1.61.0}-mcp${MCP_VERSION:-0.0.76}
    container_name: agent-browser
    restart: unless-stopped

    # --browser chromium  **必须显式指定**。MCP 默认用 Chrome 渠道版（找 /opt/google/chrome），
    #                     而官方镜像里只有 Playwright 自带的 chromium（/ms-playwright）。
    #                     不加这个参数，navigate 第一下就报
    #                     "Chromium distribution 'chrome' is not found at /opt/google/chrome/chrome"。
    #                     （--help 里 --browser 只列了 chrome/firefox/webkit/msedge，没写 chromium，
    #                       但 chromium 是可用值——实测通过。）
    # --headless          MCP 默认是 headed（有头），服务器上没 X 会直接起不来，必须显式加。
    # --isolated          浏览器 profile 只在内存里，不落盘。对应「context 用完即弃」的隔离
    #                     约定：同时消掉凭证泄漏和跨用户串号。
    # --block-service-workers  拦掉页面的 service worker。每个 SW 是一个额外后台进程，
    #                     并发场景下白占内存和 PID，而抓取/操作页面用不到它。
    # --no-sandbox        关掉 chromium 自己的 sandbox。容器里跑 chromium 要么给
    #                     cap_add: SYS_ADMIN（≈ 半个 root，更糟），要么关它——隔离边界
    #                     交给容器本身 + 非 root 用户 + 无凭证 + 网络门禁。
    # --allowed-hosts     MCP 自带的 Host 头校验（防 DNS rebinding）。默认只允许绑定的
    #                     host，跨主机用 IP 访问会被 403 挡掉且报错很难懂。默认放开成 *，
    #                     真实来源控制交给防火墙；想收紧就设成 "<服务器IP>:8089"。
    # --blocked-origins   私网段黑名单，**只是纵深防御，不是安全边界**——上游文档明确写了
    #                     它 "does not serve as a security boundary and does not affect
    #                     redirects"（重定向绕得过去）。真正的墙是出口代理 + 网络层，见 README。
    # --proxy-server      出口代理。配了 BROWSER_EGRESS_PROXY 才会带上这个参数。
    command:
      - sh
      - -lc
      - |
        exec playwright-mcp \
          --browser "${BROWSER_ENGINE:-chromium}" \
          --headless \
          --isolated \
          --no-sandbox \
          --block-service-workers \
          --host 0.0.0.0 \
          --port ${BROWSER_PORT:-8089} \
          --allowed-hosts "${MCP_ALLOWED_HOSTS:-*}" \
          --blocked-origins "${MCP_BLOCKED_ORIGINS:-http://localhost;http://127.0.0.1;http://169.254.169.254;http://10.*;http://192.168.*;http://172.16.*}" \
          --viewport-size "${BROWSER_VIEWPORT:-1280x800}" \
          --timeout-navigation ${BROWSER_NAV_TIMEOUT:-60000} \
          --output-dir /tmp/pw-output \
          ${BROWSER_EGRESS_PROXY:+--proxy-server "$BROWSER_EGRESS_PROXY"} \
          ${BROWSER_EXTRA_ARGS:-}

    ports:
      # 服务器上对外就是 8089。要收紧成只本机可见就改成 "127.0.0.1:8089:8089"
      # （前提是 agent-api 也在同一台机器上，那时更该直接走 docker 网络的服务名）。
      - "${BROWSER_HOST_PORT:-8089}:${BROWSER_PORT:-8089}"

    # chromium 默认 /dev/shm 只有 64MB，多标签页/大页面直接 SIGBUS 崩。这是 Playwright
    # 官方两个规避之一；另一个 ipc: host 会破坏 IPC 隔离，不用。
    shm_size: ${BROWSER_SHM_SIZE:-1gb}
    mem_limit: ${BROWSER_MEM_LIMIT:-4g}
    # 实测 27 PIDs/会话（10 个并发会话 = 271 PIDs）。1024 时约 38 个会话就撞 PID 上限，
    # 而 4GB 内存按 45MiB/会话能撑 85 个 —— 两个限额不匹配，PID 会先成为瓶颈。
    # 这里放到 4096 与内存能力对齐；它仍是 fork 失控的护栏，不是性能开关。
    pids_limit: ${BROWSER_PIDS_LIMIT:-4096}
    # chromium 会 fork 一堆渲染进程；PID 1 不是 init 的话僵尸会堆满 pids_limit
    init: true

    healthcheck:
      # 只验「端口有 HTTP 在应答」。不带 -f：MCP 端点对裸 GET 会回 4xx（要求 POST +
      # 正确的 Accept 头），那也算活。不用「真跑一次工具调用」做探针——每 30s 起一次
      # chromium 纯浪费。
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:${BROWSER_PORT:-8089}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    networks:
      - agent-network

  # ---- 可选：ws 远程控制端点（docker compose --profile ws up -d）----
  # 用途：沙箱里 pip install playwright（只装客户端，~50MB，不跑 playwright install、
  # 不下浏览器），然后 chromium.connect("ws://agent-browser-ws:3000/")。
  # 好处是浏览器仍然跑在这个受控服务里、仍然在代理后面，沙箱镜像一点没胖。
  agent-browser-ws:
    profiles: ["ws"]
    image: agent-browser:${PLAYWRIGHT_VERSION:-1.61.0}-mcp${MCP_VERSION:-0.0.76}
    container_name: agent-browser-ws
    restart: unless-stopped
    # --path        共享密钥：这个 ws 端点同样没有认证，URL 即凭证。.env 里已随包生成随机值。
    # --max-clients 并发连接上限。每个 client 会起自己的浏览器，不限的话内存直接失控。
    # 注意**没有** --unsafe：这是有意的。带上它客户端就能指定 executablePath / args 等
    # 启动参数（等于让远端决定在容器里执行什么），默认关着才对。
    command:
      - playwright
      - run-server
      - --port
      - "3000"
      - --host
      - 0.0.0.0
      - --path
      - /${BROWSER_WS_PATH:-CHANGE-ME-A-LONG-RANDOM-STRING}
      - --max-clients
      - "${BROWSER_WS_MAX_CLIENTS:-8}"
    ports:
      - "${BROWSER_WS_HOST_PORT:-8090}:3000"
    shm_size: ${BROWSER_SHM_SIZE:-1gb}
    mem_limit: ${BROWSER_MEM_LIMIT:-4g}
    # 实测 27 PIDs/会话（10 个并发会话 = 271 PIDs）。1024 时约 38 个会话就撞 PID 上限，
    # 而 4GB 内存按 45MiB/会话能撑 85 个 —— 两个限额不匹配，PID 会先成为瓶颈。
    # 这里放到 4096 与内存能力对齐；它仍是 fork 失控的护栏，不是性能开关。
    pids_limit: ${BROWSER_PIDS_LIMIT:-4096}
    init: true
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - agent-network

networks:
  # 默认自建一张网络（本目录独立可部署）。
  # 如果要和已有的 agent-api 同网互访，把下面两行换成：
  #   external: true
  #   name: agent-api_agent-network
  # 这样 agent-api 容器可以直接用服务名 agent-browser:8089 访问，端口都不用发布。
  agent-network:
    driver: bridge
