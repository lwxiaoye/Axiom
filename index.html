<!DOCTYPE html>
<html lang="zh_CN" id="htmlRoot">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/axiom-mark.svg" />

    <title><%= title %></title>
    <!-- 全局配置 -->
    <script>
      window._CONFIG = {};
    </script>
  </head>
  <body>
    <script>
      (() => {
        var htmlRoot = document.getElementById('htmlRoot');
        var theme = window.localStorage.getItem('__APP__DARK__MODE__');
        if (htmlRoot && theme) {
          htmlRoot.setAttribute('data-theme', theme);
        }
        // 首屏加载态的配色。只能走 JS 设变量，不能写进 <style>——见下方注释。
        // 跟随 localStorage 里应用自己的主题（而不是 prefers-color-scheme），
        // 否则系统深色 + 应用浅色时，加载态到首屏会闪一下。
        if (htmlRoot && theme === 'dark') {
          htmlRoot.style.setProperty('--app-loading-bg', '#16181d');
          htmlRoot.style.setProperty('--app-loading-track', '#2e323b');
          htmlRoot.style.setProperty('--app-loading-head', '#6b7280');
          htmlRoot.style.setProperty('--app-loading-text', '#8b909a');
        }
        theme = htmlRoot = null;
      })();
    </script>
    <div id="app">
      <!-- 首屏加载态。
           样式必须用内联 style 属性，不能用 <style> 块：@rys-fe/vite-plugin-theme
           会把 runtime 主题脚本注入到「含颜色声明的」内联 <style> 开头，浏览器按
           CSS 解析时那段 JS 非法，解析器会连带吃掉紧随其后的第一条规则（实测
           .app-loading 的定位整条失效，内容堆在页面左上角）。
           下面 <style> 里只有 @keyframes 和 @media，不含任何颜色 —— 插件因此
           不改写它，可以安全保留。往里加颜色就会重现上述问题。 -->
      <style>
        @keyframes appLoadingSpin{to{transform:rotate(360deg)}}
        @media (prefers-reduced-motion: reduce){
          .app-loading-ring{animation-duration:3.2s}
        }
      </style>
      <div
        class="app-loading"
        style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--app-loading-bg,#fafafa);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif"
      >
        <div style="display:flex;flex-direction:column;align-items:center;gap:20px">
          <div
            class="app-loading-ring"
            style="width:26px;height:26px;border:2px solid var(--app-loading-track,#e5e7eb);border-top-color:var(--app-loading-head,#9ca3af);border-radius:50%;animation:appLoadingSpin 1.4s linear infinite"
          ></div>
          <div class="app-loading-title" style="font-size:14px;color:var(--app-loading-text,#6b7280);letter-spacing:.02em"><%= title %></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
